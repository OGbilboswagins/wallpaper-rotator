name: wallpaper_rotator
description: "A simple, ad-free wallpaper rotation app for Android."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^10.3.2
  cupertino_icons: ^1.0.8
  path: ^1.9.1
  ffi: ^2.2.0
  shared_preferences: ^2.5.5
  system_tray: ^2.0.3
  window_manager: ^0.4.3
  permission_handler: ^12.0.3
  in_app_purchase: ^3.2.0
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
